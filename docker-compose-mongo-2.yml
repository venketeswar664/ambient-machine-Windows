version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: sentinel-one
    restart: unless-stopped
    # network_mode: host
    ports:
      - 27035:27017
    volumes:
      - ./data/mongodb/db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongo@3024011698
