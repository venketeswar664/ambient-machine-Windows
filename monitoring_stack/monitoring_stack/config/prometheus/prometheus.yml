global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['localhost:8080']
    
  - job_name: 'sentinel-ambient-machine-gpu'
    static_configs:
      - targets: ['localhost:9990']  
    
  # Add Docker daemon metrics if you enable the Docker metrics endpoint
  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']  # Default Docker metrics endpoint
  
  - job_name: 'blackbox-icmp'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 192.168.1.35  # Your target device
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115  # Blackbox exporter address
